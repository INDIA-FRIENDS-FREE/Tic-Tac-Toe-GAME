 <!-- यह आपके स्क्रीन पर दिखेगा -->
<div style="text-align:center; font-family:sans-serif; margin-bottom:10px;">
    <span style="height:10px; width:10px; background-color:#4caf50; border-radius:50%; display:inline-block; margin-right:5px; animate: blink 1s infinite;"></span>
    <span style="color:#555; font-weight:bold;">लाइव खिलाड़ी: <span id="live-users" style="color:#4caf50;">154</span> ऑनलाइन</span>
</div>

<script>
function updateLiveUsers() {
    // यह हर बार 140 से 180 के बीच एक रैंडम नंबर जनरेट करेगा
    const baseUsers = Math.floor(Math.random() * (180 - 140 + 1)) + 140;
    document.getElementById("live-users").innerText = baseUsers;
}

// हर 4 सेकंड (4000 मिलीसेकंड) में नंबर अपने आप बदलेगा ताकि असली लगे
setInterval(updateLiveUsers, 4000);
</script>
