 <!-- इसे अपने मुख्य हेडिंग (H1) के ठीक नीचे पेस्ट करो -->
<div style="text-align:center; font-family:Arial, sans-serif; margin: 15px auto; padding: 5px; background: #e8f5e9; border-radius: 5px; display: block; width: fit-content; border: 1px solid #c8e6c9; position: relative; z-index: 9999;">
    <span style="height:10px; width:10px; background-color:#4caf50; border-radius:50%; display:inline-block; margin-right:5px;"></span>
    <span style="color:#2e7d32; font-weight:bold; font-size: 16px;">लाइव खिलाड़ी: <span id="live-users">154</span> ऑनलाइन</span>
</div>

<script>
function updateLiveUsers() {
    // यह हर बार 145 से 175 के बीच रैंडम नंबर दिखाएगा
    const baseUsers = Math.floor(Math.random() * (175 - 145 + 1)) + 145;
    const element = document.getElementById("live-users");
    if(element) {
        element.innerText = baseUsers;
    }
}
// हर 3 सेकंड में नंबर बदलेगा
setInterval(updateLiveUsers, 3000);
// पहली बार पेज खुलते ही तुरंत रन करने के लिए
updateLiveUsers();
</script>
