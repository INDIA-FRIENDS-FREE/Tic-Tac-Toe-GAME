 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कट-गोला गेम (Tic-Tac-Toe Fixed)</title>
    <style>
        /* डिफ़ॉल्ट डार्क ब्लू थीम - थीम बटन पूरी तरह हटा दिया गया है */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        /* साधारण गेम बटन्स */
        .cell {
            background: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            width: 100px;
            height: 100px;
            color: #333;
        }

        .cell:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }

        /* जब कोई खाना भरा जाएगा (मैन्युअल टेस्टिंग के लिए) */
        .cell.X { color: #ff4757; }
        .cell.O { color: #2ed573; }

        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #ffa500;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #ff7f00;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>❌ कट-गोला गेम ⭕</h1>

    <!-- ग्रिड बोर्ड जिसमें थीम का कोई विकल्प नहीं है -->
    <div class="board" id="board">
        <button class="cell" onclick="this.innerText='X'; this.style.color='#ff4757'"> </button>
        <button class="cell" onclick="this.innerText='O'; this.style.color='#2ed573'"> </button>
        <button class="cell" onclick="this.innerText='X'; this.style.color='#ff4757'"> </button>
        <button class="cell" onclick="this.innerText=' ';"></button>
        <button class="cell" onclick="this.innerText=' ';"></button>
        <button class="cell" onclick="this.innerText=' ';"></button>
        <button class="cell" onclick="this.innerText=' ';"></button>
        <button class="cell" onclick="this.innerText=' ';"></button>
        <button class="cell" onclick="this.innerText=' ';"></button>
    </div>

    <button class="btn" onclick="window.location.reload()">गेम रीस्टार्ट करें</button>

</body>
</html>
