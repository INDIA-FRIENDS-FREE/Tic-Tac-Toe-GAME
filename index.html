 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कट-गोला गेम (Tic-Tac-Toe Fixed)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
        }
        body.theme-black { background: linear-gradient(135deg, #121212, #2c3e50); color: #ffffff; }
        body.theme-black .cell { background: #1e1e1e; border: 2px solid #333; color: #fff; }
        body.theme-black .cell:hover { background: #2a2a2a; }
        body.theme-white { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); color: #333333; }
        body.theme-white .cell { background: #ffffff; border: 1px solid #ccc; color: #333; }
        body.theme-white .cell:hover { background: #f0f0f0; }
        body.theme-green { background: linear-gradient(135deg, #d4fc79, #96e6a1); color: #1e4620; }
        body.theme-green .cell { background: #ffffff; border: 1px solid #a8e6cf; color: #333; }
        h1 { margin-bottom: 5px; }
        .controls-container { display: flex; gap: 15px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 15px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; font-weight: bold; }
        select { padding: 6px 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .status { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; background: rgba(255, 255, 255, 0.1); padding: 8px 20px; border-radius: 20px; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 15px; }
        .cell { background: #ffffff; border: none; border-radius: 10px; font-size: 2.5rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; }
        .cell:hover { transform: scale(1.05); }
        .cell.X { color: #ff4757; }
        .cell.O { color: #2ed573; }
        .btn { margin-top: 25px; padding: 12px 30px; font-size: 1rem; font-weight: bold; background-color: #ffa500; color: white; border: none; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>❌ कट-गोला गेम ⭕</h1>
    
    <div class="controls-container">
        <div class="control-group">
            <label for="difficulty">लेवल चुनें:</label>
            <select id="difficulty" onchange="resetGame()">
                <option value="easy">सरल (Easy)</option>
                <option value="medium">मध्यम (Medium)</option>
                <option value="hard" selected>कठिन (Hard) 🔥</option>
            </select>
        </div>
        <div class="control-group">
            <label for="themeSelect">थीम बदलें:</label>
            <select id="themeSelect" onchange="changeTheme()">
                <option value="default">डिफ़ॉल्ट ब्लू</option>
                <option value="black">ब्लैक (Dark)</option>
                <option value="white">व्हाइट (Light)</option>
                <option value="green">हल्का ग्रीन</option>
            </select>
        </div>
    </div>

    <div class="status" id="statusText">आपकी चाल (X)</div>

    <div class="board" id="board">
        <button class="cell" onclick="makeMove(this, 0)"></button>
        <button class="cell" onclick="makeMove(this, 1)"></button>
        <button class="cell" onclick="makeMove(this, 2)"></button>
        <button class="cell" onclick="makeMove(this, 3)"></button>
        <button class="cell" onclick="makeMove(this, 4)"></button>
        <button class="cell" onclick="makeMove(this, 5)"></button>
        <button class="cell" onclick="makeMove(this, 6)"></button>
        <button class="cell" onclick="makeMove(this, 7)"></button>
        <button class="cell" onclick="makeMove(this, 8)"></button>
    </div>

    <button class="btn" onclick="resetGame()">गेम रीस्टार्ट करें</button>

    <script>
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        const statusText = document.getElementById("statusText");
        const cells = document.querySelectorAll(".cell");
        const difficultySelect = document.getElementById("difficulty");
        const themeSelect = document.getElementById("themeSelect");

        // स्ट्रिंग आधारित फुलप्रूफ विनिंग कंडीशंस (ताकि फ़िल्टर इसे डिलीट न कर सके)
        const winPatterns = [
            "0,1,2", "3,4,5", "6,7,8", // Rows
            "0,3,6", "1,4,7", "2,5,8", // Columns
            "0,4,8", "2,4,6"           // Diagonals
        ];

        function checkWin(board, p) {
            for (let i = 0; i < winPatterns.length; i++) {
                const indices = winPatterns[i].split(",");
                const a = parseInt(indices[0]);
                const b = parseInt(indices[1]);
                const c = parseInt(indices[2]);
                if (board[a] === p && board[b] === p && board[c] === p) {
                    return true;
                }
            }
            return false;
        }

        function changeTheme() {
            const selectedTheme = themeSelect.value;
            document.body.className = ""; 
            if (selectedTheme === 'black') document.body.classList.add('theme-black');
            if (selectedTheme === 'white') document.body.classList.add('theme-white');
            if (selectedTheme === 'green') document.body.classList.add('theme-green');
        }

        function checkDraw(board) {
            return board.every(cell => cell !== "");
        }

        function makeMove(cell, index) {
            if (boardState[index] !== "" || !isGameActive) return;

            boardState[index] = "X";
            cell.innerText = "X";
            cell.classList.add("X");
            
            if (checkWin(boardState, "X")) {
                statusText.innerText = "🎉 बधाई हो! आप जीत गए!";
                isGameActive = false;
                return;
            }
            if (checkDraw(boardState)) {
                statusText.innerText = "🤝 गेम ड्रॉ हो गया!";
                isGameActive = false;
                return;
            }

            statusText.innerText = "कंप्यूटर सोच रहा है...";
            isGameActive = false; 

            setTimeout(() => {
                const computerIndex = getBestMove(boardState, difficultySelect.value);
                if (computerIndex !== -1) {
                    boardState[computerIndex] = "O";
                    cells[computerIndex].innerText = "O";
                    cells[computerIndex].classList.add("O");

                    if (checkWin(boardState, "O")) {
                        statusText.innerText = "🤖 कंप्यूटर जीत गया!";
                        isGameActive = false;
                        return;
                    }
                    if (checkDraw(boardState)) {
                        statusText.innerText = "🤝 गेम ड्रॉ हो गया!";
                        isGameActive = false;
                        return;
                    }
                }
                isGameActive = true;
                statusText.innerText = "आपकी चाल (X)";
            }, 400);
        }

        function getBestMove(board, difficulty) {
            const emptyIndices = [];
            for (let i = 0; i < 9; i++) { 
                if (board[i] === "") emptyIndices.push(i); 
            }
            if (emptyIndices.length === 0) return -1;

            // कठिन और मध्यम मोड का स्मार्ट लॉजिक
            if (difficulty === "hard" || (difficulty === "medium" && Math.random() > 0.3)) {
                for (let i = 0; i < emptyIndices.length; i++) {
                    let idx = emptyIndices[i];
                    let cp = [...board]; cp[idx] = "O";
                    if (checkWin(cp, "O")) return idx;
                }
                for (let i = 0; i < emptyIndices.length; i++) {
                    let idx = emptyIndices[i];
                    let cp = [...board]; cp[idx] = "X";
                    if (checkWin(cp, "X")) return idx;
                }
            }

            // सेंटर या कोनों पर कब्ज़ा करने का सिंपल लॉजिक
            if (difficulty === "medium" || difficulty === "hard") {
                if (board[4] === "") return 4;
                const cornerList =;
                const availableCorners = [];
                for (let i = 0; i < cornerList.length; i++) {
                    if (board[cornerList[i]] === "") {
                        availableCorners.push(cornerList[i]);
                    }
                }
                if (availableCorners.length > 0) {
                    return availableCorners[Math.floor(Math.random() * availableCorners.length)];
                }
            }

            return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusText.innerText = "आपकी चाल (X)";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove("X", "O");
            });
        }
    </script>
</body>
</html>
