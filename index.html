 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Pro (Target 5)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- टॉप बार: लेवल और थीम सेलेक्टर -->
        <div class="top-bar">
            <!-- लेवल सेलेक्ट बटन (ड्रॉपडाउन) -->
            <div class="level-container">
                <label for="difficulty-select" class="level-label">लेवल:</label>
                <select id="difficulty-select" class="level-dropdown">
                    <option value="easy">सरल (Easy)</option>
                    <option value="medium" selected>मध्यम (Medium)</option>
                    <option value="hard">कठिन (Hard)</option>
                </select>
            </div>

            <!-- थीम बटन्स -->
            <div class="theme-selector">
                <button class="theme-btn white-btn" data-theme="white" title="सफेद थीम"></button>
                <button class="theme-btn black-btn" data-theme="black" title="काली थीम"></button>
                <button class="theme-btn green-btn" data-theme="green" title="हल्की हरी थीम"></button>
                <button class="theme-btn purple-btn" data-theme="purple" title="बैंगनी थीम"></button>
            </div>
        </div>

        <h1>कट-गोला गेम (Tic-Tac-Toe)</h1>
        
        <!-- स्कोरबोर्ड सेक्शन -->
        <div class="scoreboard">
            <div class="score-box">
                <span class="label">आप (X)</span>
                <span id="player-score" class="score">0</span>
            </div>
            <div class="target-box">
                <span class="target-title">टारगेट स्कोर</span>
                <span class="target-num">5</span>
            </div>
            <div class="score-box">
                <span class="label">कंप्यूटर (O)</span>
                <span id="computer-score" class="score">0</span>
            </div>
        </div>

        <!-- स्टेटस मैसेज -->
        <div id="status-message" class="status">आपकी चाल (X)</div>

        <!-- गेम बोर्ड -->
        <div class="board" id="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- कंट्रोल बटन्स -->
        <div class="btn-container">
            <button id="reset-round-btn" class="main-action-btn">राउंड रीसेट करें</button>
            <button id="reset-all-btn" class="danger-btn">पूरा मैच रीसेट करें</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
