 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Neon Tic-Tac-Toe Ultra ⚡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

    <!-- थीम बदलने का बटन -->
    <button id="themeToggleBtn" class="theme-toggle-btn">Theme 🎨</button>

    <div class="game-container">
        <!-- SCREEN 1: WELCOME MENU -->
        <div id="setupScreen" class="setup-screen">
            <h1>🎮 TIC-TAC-TOE PRO </h1>
            <p>Enter your nickname to start:</p>
            <input type="text" id="playerNameInput" placeholder="Type your name here..." autocomplete="off">
            
            <div class="mode-buttons">
                <button id="btnVsComputer" class="mode-btn blue-btn">🤖 VS Computer</button>
                <button id="btnVsFriend" class="mode-btn green-btn">👥 VS Friend (Offline)</button>
            </div>
        </div>

        <!-- SCREEN 2: GAME BOARD -->
        <div id="gameScreen" class="game-screen" style="display: none;">
            <h2 id="matchTitle">Player VS Computer</h2>
            <p class="status-text" id="statusText">Your Turn (X)</p>

            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="action-buttons">
                <button class="control-btn" id="resetBtn">Restart Game 🔄</button>
                <button class="control-btn menu-btn" id="menuBtn">Main Menu 🏠</button>
            </div>
        </div>
    </div>

    <audio id="clickSound" src="https://mixkit.co"></audio>
    <audio id="winSound" src="https://mixkit.co"></audio>

    <script src="script.js"></script>
</body>
</html>
