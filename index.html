 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कट-गोला गेम (Tic-Tac-Toe)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .cell {
            background: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            width: 100px;
            height: 100px;
        }
        .cell:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        .cell.X {
            color: #ff4757;
        }
        .cell.O {
            color: #2ed573;
        }
        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #ffa500;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #ff7f00;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>❌ कट-गोला गेम ⭕</h1>
    <div class="status" id="statusText">आपकी चाल (X)</div>

    <div class="board" id="board">
        <button class="cell" onclick="makeMove(this, 0)"></button>
        <button class="cell" onclick="makeMove(this, 1)"></button>
        <button class="cell" onclick="makeMove(this, 2)"></button>
        <button class="cell" onclick="makeMove(this, 3)"></button>
        <button class="cell" onclick="makeMove(this, 4)"></button>
        <button class="cell" onclick="makeMove(this, 5)"></button>
        <button class="cell" onclick="makeMove(this, 6)"></button>
        <button class="cell" onclick="makeMove(this, 7)"></button>
        <button class="cell" onclick="makeMove(this, 8)"></button>
    </div>

    <button class="btn" onclick="resetGame()">गेम रीस्टार्ट करें</button>

    <script>
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        const statusText = document.getElementById("statusText");
        const cells = document.querySelectorAll(".cell");

        // जीतने की सारी सही शर्तें
        const winningConditions = [, [3, 4, 5], [6, 7, 8], // Rows, [1, 4, 7], [2, 5, 8], // Columns, [2, 4, 6]             // Diagonals
        ];

        function makeMove(cell, index) {
            if (boardState[index] !== "" || !isGameActive) return;

            // खिलाड़ी की चाल (X)
            boardState[index] = "X";
            cell.innerText = "X";
            cell.classList.add("X");
            
            if (checkWin("X")) {
                statusText.innerText = "🎉 बधाई हो! आप जीत गए!";
                isGameActive = false;
                return;
            }

            if (boardState.includes("")) {
                statusText.innerText = "⚡ कंप्यूटर सोच रहा है...";
                isGameActive = false; 
                setTimeout(computerMove, 500); // 0.5 सेकंड का डिले
            } else {
                statusText.innerText = "🤝 मैच ड्रॉ हो गया!";
                isGameActive = false;
            }
        }

        function computerMove() {
            // कंप्यूटर का दिमाग: पहले जीतने की कोशिश, फिर खिलाड़ी को रोकना
            let move = findBestMove("O") || findBestMove("X") || getRandomMove();

            if (move !== null) {
                boardState[move] = "O";
                cells[move].innerText = "O";
                cells[move].classList.add("O");

                if (checkWin("O")) {
                    statusText.innerText = "😢 कंप्यूटर जीत गया! फिर से कोशिश करें।";
                    isGameActive = false;
                    return;
                }

                if (!boardState.includes("")) {
                    statusText.innerText = "🤝 मैच ड्रॉ हो गया!";
                    isGameActive = false;
                    return;
                }
            }
            
            statusText.innerText = "आपकी चाल (X)";
            isGameActive = true;
        }

        function findBestMove(player) {
            for (let condition of winningConditions) {
                let count = 0;
                let emptyIndex = null;
                for (let index of condition) {
                    if (boardState[index] === player) count++;
                    else if (boardState[index] === "") emptyIndex = index;
                }
                if (count === 2 && emptyIndex !== null) {
                    return emptyIndex;
                }
            }
            return null;
        }

        function getRandomMove() {
            let availableMoves = [];
            boardState.forEach((val, idx) => { if (val === "") availableMoves.push(idx); });
            if (availableMoves.length === 0) return null;
            return availableMoves[Math.floor(Math.random() * availableMoves.length)];
        }

        function checkWin(player) {
            return winningConditions.some(condition => {
                return condition.every(index => boardState[index] === player);
            });
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusText.innerText = "आपकी चाल (X)";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove("X", "O");
            });
        }
    </script>
</body>
</html>
