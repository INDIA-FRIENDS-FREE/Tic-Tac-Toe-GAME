 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कट-गोला गेम (Tic-Tac-Toe Ultimate)</title>
    <style>
        /* डिफ़ॉल्ट डार्क ब्लू थीम */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
        }

        /* 🖤 ब्लैक थीम */
        body.theme-black {
            background: linear-gradient(135deg, #121212, #2c3e50);
            color: #ffffff;
        }
        body.theme-black .cell { background: #1e1e1e; border: 2px solid #333; color: #fff; }
        body.theme-black .cell:hover { background: #2a2a2a; }

        /* 🤍 व्हाइट थीम */
        body.theme-white {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333333;
        }
        body.theme-white .cell { background: #ffffff; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333; }
        body.theme-white .cell:hover { background: #f0f0f0; }
        body.theme-white .status { background: rgba(0, 0, 0, 0.05); color: #333; }
        body.theme-white label { color: #333; }

        /* 💚 हल्का ग्रीन थीम */
        body.theme-green {
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
            color: #1e4620;
        }
        body.theme-green .cell { background: #ffffff; border: 1px solid #a8e6cf; color: #333; }
        body.theme-green .cell:hover { background: #f1fcf6; }
        body.theme-green .status { background: rgba(255, 255, 255, 0.4); color: #1e4620; }
        body.theme-green label { color: #1e4620; }

        h1 {
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .controls-container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 15px;
        }
        body.theme-white .controls-container { background: rgba(0, 0, 0, 0.05); }
        body.theme-green .controls-container { background: rgba(255, 255, 255, 0.3); }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        select {
            padding: 6px 12px;
            font-size: 0.95rem;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            background: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        body.theme-white .board { background: rgba(0, 0, 0, 0.05); }
        body.theme-green .board { background: rgba(255, 255, 255, 0.2); }

        .cell {
            background: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            width: 100px;
            height: 100px;
        }
        .cell:hover {
            transform: scale(1.05);
        }
        .cell.X { color: #ff4757; }
        .cell.O { color: #2ed573; }
        
        body.theme-black .cell.X { color: #ff4757; text-shadow: 0 0 10px #ff4757; }
        body.theme-black .cell.O { color: #2ed573; text-shadow: 0 0 10px #2ed573; }

        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #ffa500;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #ff7f00;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>❌ कट-गोला गेम ⭕</h1>
    
    <div class="controls-container">
        <div class="control-group">
            <label for="difficulty">लेवल चुनें:</label>
            <select id="difficulty" onchange="resetGame()">
                <option value="easy">सरल (Easy)</option>
                <option value="medium">मध्यम (Medium)</option>
                <option value="hard" selected>कठिन (Hard) 🔥</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="themeSelect">थीम बदलें:</label>
            <select id="themeSelect" onchange="changeTheme()">
                <option value="default">डिफ़ॉल्ट ब्लू</option>
                <option value="black">ब्लैक (Dark)</option>
                <option value="white">व्हाइट (Light)</option>
                <option value="green">हल्का ग्रीन</option>
            </select>
        </div>
    </div>

    <div class="status" id="statusText">आपकी चाल (X)</div>

    <div class="board" id="board">
        <button class="cell" onclick="makeMove(this, 0)"></button>
        <button class="cell" onclick="makeMove(this, 1)"></button>
        <button class="cell" onclick="makeMove(this, 2)"></button>
        <button class="cell" onclick="makeMove(this, 3)"></button>
        <button class="cell" onclick="makeMove(this, 4)"></button>
        <button class="cell" onclick="makeMove(this, 5)"></button>
        <button class="cell" onclick="makeMove(this, 6)"></button>
        <button class="cell" onclick="makeMove(this, 7)"></button>
        <button class="cell" onclick="makeMove(this, 8)"></button>
    </div>

    <button class="btn" onclick="resetGame()">गेम रीस्टार्ट करें</button>

    <script>
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        const statusText = document.getElementById("statusText");
        const cells = document.querySelectorAll(".cell");
        const difficultySelect = document.getElementById("difficulty");
        const themeSelect = document.getElementById("themeSelect");

        // यहाँ सारे नंबर बिल्कुल सही से भर दिए हैं!
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function changeTheme() {
            const selectedTheme = themeSelect.value;
            document.body.classList.remove('theme-black', 'theme-white', 'theme-green');
            
            if (selectedTheme === 'black') {
                document.body.classList.add('theme-black');
            } else if (selectedTheme === 'white') {
                document.body.classList.add('theme-white');
            } else if (selectedTheme === 'green') {
                document.body.classList.add('theme-green');
            }
        }

        function makeMove(cell, index) {
            if (boardState[index] !== "" || !isGameActive) return;

            boardState[index] = "X";
            cell.innerText = "X";
            cell.classList.add("X");
            
            if (checkWin(boardState, "X")) {
                statusText.innerText = "🎉 बधाई हो! आप जीत गए!";
                isGameActive = false;
                return;
            }

            if (!boardState.includes("")) {
                statusText.innerText = "🤝 मैच ड्रॉ हो गया!";
                isGameActive = false;
                return;
            }

            computerMove();
        }

        function computerMove() {
            const level = difficultySelect.value;
            let move = null;

            if (level === "easy") {
                move = getRandomMove();
            } else if (level === "medium") {
                move = findImmediateMove("O") || findImmediateMove("X") || getRandomMove();
            } else if (level === "hard") {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (boardState[i] === "") {
                        boardState[i] = "O";
                        let score = minimax(boardState, 0, true);
                        boardState[i] = "";
                        if (score < bestScore) {
                            bestScore = score;
                            move = i;
                        }
                    }
                }
            }

            if (move !== null && move !== undefined) {
                boardState[move] = "O";
                cells[move].innerText = "O";
                cells[move].classList.add("O");

                if (checkWin(boardState, "O")) {
                    statusText.innerText = "😢 कंप्यूटर जीत गया! भाई से कहो फिर खेले।";
                    isGameActive = false;
                    return;
                }

                    return;
